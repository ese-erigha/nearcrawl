# NearCrawl gateway Worker.
# Local development stays on Node: `pnpm --filter gateway dev`.
# Node reads the business limits below when those names are absent from the environment.
# Do not put secrets in this file.
# After CI creates this Worker, set DATABASE_URL, NEON_REALTIME_SECRET,
# NEON_REALTIME_URL, SENTRY_DSN, INFERENCE_URL, and INFERENCE_SECRET
# in the Cloudflare dashboard.
# Wrangler comes from this package's devDependencies. The deploy action uses that binary.

name = "nearcrawl-gateway"
main = "src/app.ts"
compatibility_date = "2026-10-26"
compatibility_flags = ["nodejs_compat"]

[vars]
SENTRY_ENVIRONMENT = "production"
SPATIAL_NEWS_CAP = "200"
CATEGORY_ARTICLES_DEFAULT = "20"
CATEGORY_ARTICLES_CAP = "100"
FEED_RETENTION_DAYS = "14"
HOT_NEWS_CAP = "20"

[observability]
enabled = true
